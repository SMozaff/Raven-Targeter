[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-targeter"
version = "0.3.1"
description = "Desktop GitHub discovery tool for recent user-created AI API projects and endpoints"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2,<3",
  "python-dateutil>=2.9,<3",
  "PySide6>=6.8,<7",
  "keyring>=25,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
packaging = ["pyinstaller>=6,<7"]

[project.scripts]
raven-hunter = "raven_targeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100